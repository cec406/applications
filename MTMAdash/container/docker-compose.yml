# Shop Ops — container stack.
#
#   docker compose -f container/docker-compose.yml up -d --build
#   podman-compose -f container/docker-compose.yml up -d --build
#
# The build context is the repository root (one level up), so this file can
# live in its own folder without duplicating the app.
services:
  shopops:
    image: ${SHOPOPS_IMAGE:-ghcr.io/cec406/mtmadash:latest}
    build:
      context: ..
      dockerfile: container/Dockerfile
    container_name: shopops
    restart: unless-stopped
    ports:
      - "${SHOPOPS_PORT:-4321}:4321"
    environment:
      PORT: "4321"
      HOST: "0.0.0.0"
      DATA_FILE: /data/db.json
      # Optional: a default name for the activity log (users can still set their
      # own name under Settings → Your Name).
      # TZ: America/New_York
    volumes:
      - shopops-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4321/api/state').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

volumes:
  shopops-data:
