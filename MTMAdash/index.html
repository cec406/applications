<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0b1120" />
  <title>Shop Ops · Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%20%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%230f172a%22%2F%3E%20%3Cpath%20d%3D%22M7%2020l4-9%204%209%22%20fill%3D%22none%22%20stroke%3D%22%2338bdf8%22%20stroke-width%3D%222.4%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%20%3Cpath%20d%3D%22M17%2011v9%22%20stroke%3D%22%23f59e0b%22%20stroke-width%3D%222.4%22%20stroke-linecap%3D%22round%22%2F%3E%20%3Ccircle%20cx%3D%2223%22%20cy%3D%2220%22%20r%3D%222.6%22%20fill%3D%22none%22%20stroke%3D%22%2322c55e%22%20stroke-width%3D%222.4%22%2F%3E%20%3C%2Fsvg%3E" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
/* =========================================================================
   Shopline - maintenance dashboard styles
   Themes: dark (default), light, and a high-contrast kiosk theme.
   ========================================================================= */

:root {
  --bg: #0a1120;
  --bg-2: #0e1628;
  --panel: #121c33;
  --panel-2: #16223d;
  --border: #23324f;
  --border-soft: #1b2942;
  --text: #e7eefb;
  --muted: #8ba1c2;
  --accent: #38bdf8;
  --accent-2: #0ea5e9;
  --good: #22c55e;
  --warn: #f59e0b;
  --bad: #ef4444;
  --info: #60a5fa;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 10px 30px rgba(2, 8, 23, 0.45);
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

html[data-theme="light"] {
  --bg: #eef2f9;
  --bg-2: #e6ecf6;
  --panel: #ffffff;
  --panel-2: #f6f9fe;
  --border: #d7e0ee;
  --border-soft: #e6ecf6;
  --text: #101a2c;
  --muted: #5c6d88;
  --accent: #0284c7;
  --accent-2: #0369a1;
  --shadow: 0 8px 24px rgba(15, 30, 60, 0.12);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; }
button { font-family: inherit; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.strong { font-weight: 600; }
.spacer { flex: 1; }
.icon { flex: none; }
.inline-gap { display: inline-flex; align-items: center; gap: 8px; }

/* ---------- app layout ---------- */
.app { display: grid; grid-template-columns: 248px 1fr; height: 100vh; overflow: hidden; }
.main { display: flex; flex-direction: column; min-width: 0; }

.sidebar {
  background: linear-gradient(180deg, var(--bg-2), var(--bg));
  border-right: 1px solid var(--border-soft);
  display: flex; flex-direction: column; padding: 14px 12px; gap: 8px; overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 8px 8px 14px; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--accent), #6366f1); color: #06101f;
}
.brand-name { font-weight: 700; letter-spacing: -0.02em; }
.brand-tag { font-size: 11.5px; color: var(--muted); }

.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: var(--radius-sm);
  text-decoration: none; color: var(--muted); font-weight: 500; font-size: 14px; transition: background .12s, color .12s;
}
.nav-item:hover { background: var(--panel); color: var(--text); }
.nav-item.active { background: var(--panel-2); color: var(--text); box-shadow: inset 2px 0 0 var(--accent); }
.nav-item.active .icon { color: var(--accent); }
.nav-badge {
  margin-left: auto; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px;
  background: var(--panel-2); color: var(--muted); border: 1px solid var(--border);
}
.nav-badge.bad { background: rgba(239, 68, 68, 0.16); color: #fca5a5; border-color: rgba(239, 68, 68, 0.4); }
.nav-badge.warn { background: rgba(245, 158, 11, 0.16); color: #fcd34d; border-color: rgba(245, 158, 11, 0.4); }
.sidebar-foot { margin-top: auto; padding: 10px; border-top: 1px solid var(--border-soft); }

/* ---------- topbar ---------- */
.topbar {
  position: relative; display: flex; align-items: center; gap: 14px; padding: 12px 18px;
  border-bottom: 1px solid var(--border-soft); background: var(--bg-2);
}
.topbar-title h1 { font-size: 17px; margin: 0; letter-spacing: -0.02em; }
.topbar-title p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
.menu-btn { display: none; }

.global-search {
  display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--border);
  border-radius: 999px; padding: 7px 14px; width: min(360px, 34vw); color: var(--muted);
}
.global-search input { border: none; background: transparent; outline: none; color: var(--text); width: 100%; font-size: 14px; }

.conn { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel); }
.conn-text { display: flex; flex-direction: column; line-height: 1.15; }
.conn-text span:first-child { font-size: 12.5px; font-weight: 600; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.ok { background: var(--good); box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18); animation: softpulse 2.4s infinite; }
.dot.bad { background: var(--bad); box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.18); }
@keyframes softpulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }

/* ---------- content ---------- */
.content { flex: 1; overflow-y: auto; padding: 20px 22px 60px; }
.view { display: flex; flex-direction: column; gap: 16px; max-width: 1600px; margin: 0 auto; }
.view-body { display: flex; flex-direction: column; gap: 16px; }

.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.section-head h2 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
.section-head p { margin: 2px 0 0; font-size: 13px; }
.section-actions { display: flex; align-items: center; gap: 10px; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 13.5px; font-weight: 600;
  cursor: pointer; transition: transform .06s, background .12s, border-color .12s;
}
.btn:hover { background: var(--panel-2); border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; color: #041022; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--bad); border-color: transparent; color: #fff; }
.btn.ghost-soft { background: rgba(239, 68, 68, 0.12); color: #fca5a5; border-color: rgba(239, 68, 68, 0.35); }

.icon-btn {
  display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 7px;
  border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; transition: background .12s, color .12s;
}
.icon-btn:hover { background: var(--panel); color: var(--text); }
.icon-btn.tiny { width: 24px; height: 24px; }
.icon-btn.danger-hover:hover { color: #fca5a5; background: rgba(239, 68, 68, 0.12); }

.mini-btn {
  display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 4px 8px;
  border-radius: 7px; border: 1px solid var(--border); background: var(--panel-2); color: var(--good); cursor: pointer;
}
.mini-btn:hover { border-color: var(--good); }

.segmented { display: inline-flex; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 3px; gap: 2px; }
.seg { display: inline-flex; align-items: center; gap: 6px; border: none; background: transparent; color: var(--muted); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
.seg.active { background: var(--panel-2); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.2); }

.check { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); cursor: pointer; }

/* ---------- inputs ---------- */
.input {
  background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm);
  padding: 8px 11px; font-size: 14px; outline: none; width: 100%; transition: border-color .12s, box-shadow .12s;
}
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.16); }
.input.compact { width: auto; padding: 8px 10px; }
textarea.input { resize: vertical; font-family: inherit; }
select.input { cursor: pointer; }

.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.toolbar-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.toolbar-right { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.search-wrap { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0 10px; color: var(--muted); min-width: 240px; }
.search-wrap:focus-within { border-color: var(--accent); }
.search-input { border: none; background: transparent; padding: 8px 0; }

/* ---------- chips / badges ---------- */
.chip {
  display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600;
  color: var(--chip, var(--accent)); background: color-mix(in srgb, var(--chip, var(--accent)) 16%, transparent);
  border: 1px solid color-mix(in srgb, var(--chip, var(--accent)) 42%, transparent); white-space: nowrap;
}
.badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; border: 1px solid var(--border); color: var(--muted); }
.badge.bad { color: #fca5a5; background: rgba(239,68,68,.12); border-color: rgba(239,68,68,.38); }
.badge.warn { color: #fcd34d; background: rgba(245,158,11,.12); border-color: rgba(245,158,11,.38); }
.badge.info { color: #93c5fd; background: rgba(96,165,250,.12); border-color: rgba(96,165,250,.38); }
.tag { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--panel-2); color: var(--muted); letter-spacing: .03em; }
.tag.wo { color: var(--info); }
.tag.pm { color: var(--warn); }

/* ---------- panels ---------- */
.panel { background: var(--panel); border: 1px solid var(--border-soft); border-radius: var(--radius); overflow: hidden; }
.panel-head { display: flex; align-items: center; gap: 9px; padding: 13px 16px; border-bottom: 1px solid var(--border-soft); }
.panel-head h3 { margin: 0; font-size: 14.5px; font-weight: 600; }
.panel-head .icon { color: var(--accent); }
.panel-body { padding: 16px; }
.panel-foot { padding: 12px 16px; border-top: 1px solid var(--border-soft); display: flex; justify-content: flex-end; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }

/* ---------- kpi ---------- */
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi-row-5 { grid-template-columns: repeat(5, 1fr); }
.kpi-row-3 { grid-template-columns: repeat(3, 1fr); }
.mini-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.mini-kpis-3 { grid-template-columns: repeat(3, 1fr); }
.kpi { background: var(--panel); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 14px 16px; position: relative; overflow: hidden; }
.kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); opacity: .7; }
.kpi.bad::before { background: var(--bad); }
.kpi.warn::before { background: var(--warn); }
.kpi.accent::before { background: var(--accent); }
.kpi.good::before { background: var(--good); }
.kpi.good .kpi-value { color: #86efac; }
.kpi-value { font-size: 30px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
.kpi-label { font-size: 12.5px; color: var(--muted); margin-top: 6px; font-weight: 500; }
.kpi-sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.kpi.bad .kpi-value { color: #fca5a5; }
.kpi.warn .kpi-value { color: #fcd34d; }

/* ---------- lists ---------- */
.list { list-style: none; margin: 0; padding: 0; }
.list-item { display: flex; align-items: center; gap: 11px; padding: 11px 16px; border-bottom: 1px solid var(--border-soft); cursor: pointer; transition: background .12s; }
.list-item:hover { background: var(--panel-2); }
.list-item:last-child { border-bottom: none; }
.list-item.empty-ok { color: var(--muted); cursor: default; }
.li-body { flex: 1; min-width: 0; }
.li-title { font-size: 13.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pulse { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--muted); }
.pulse.bad { background: var(--bad); box-shadow: 0 0 0 4px rgba(239,68,68,.14); }
.pulse.warn { background: var(--warn); box-shadow: 0 0 0 4px rgba(245,158,11,.14); }

.activity { list-style: none; margin: 0; padding: 4px 0; max-height: 420px; overflow-y: auto; }
.activity li { display: flex; gap: 11px; padding: 9px 16px; }
.activity .dot { width: 7px; height: 7px; margin-top: 6px; background: var(--accent); flex: none; }

.bars { padding: 8px 4px; }
.bar-row { display: grid; grid-template-columns: 120px 1fr 34px; align-items: center; gap: 12px; padding: 7px 12px; }
.bar-label { font-size: 12.5px; color: var(--muted); }
.bar-track { height: 10px; background: var(--bg-2); border-radius: 999px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 999px; transition: width .4s ease; }
.bar-value { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px; }

/* ---------- tables ---------- */
.table-wrap { background: var(--panel); border: 1px solid var(--border-soft); border-radius: var(--radius); overflow: auto; }
.data-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.data-table th { position: sticky; top: 0; z-index: 1; background: var(--panel-2); text-align: left; padding: 11px 13px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 700; border-bottom: 1px solid var(--border); white-space: nowrap; }
.data-table th.sortable { cursor: pointer; user-select: none; }
.data-table th.sortable:hover { color: var(--text); }
.data-table th.sorted { color: var(--accent); }
.data-table th.wide { min-width: 240px; }
.sort-arrow { margin-left: 5px; }
.data-table td { padding: 9px 13px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
.data-table tbody tr:hover { background: var(--panel-2); }
.data-table tr.row-bad td { background: rgba(239, 68, 68, 0.07); }
.data-table tr.row-warn td { background: rgba(245, 158, 11, 0.06); }
.data-table tr.flash td { animation: flash 1.6s ease; }
@keyframes flash { 0% { background: rgba(56,189,248,.35); } 100% { background: transparent; } }
.data-table td.editable { cursor: text; }
.data-table td.editable:hover { box-shadow: inset 0 0 0 1px var(--border); }
.data-table td.empty { text-align: center; color: var(--muted); padding: 34px; }
.actions-col { text-align: right; white-space: nowrap; width: 1%; }
.actions-col .icon-btn { display: inline-grid; }
.inline-input { padding: 5px 8px; font-size: 13.5px; min-width: 90px; }
.qty-pill { min-width: 34px; display: inline-block; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.path-cell { display: inline-flex; align-items: center; gap: 6px; max-width: 320px; }
.path-text { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--info); }
code.path-text { display: block; padding: 4px 8px; background: var(--bg-2); border-radius: 6px; margin-top: 4px; }

/* ---------- kanban board ---------- */
.board { display: grid; grid-template-columns: repeat(5, minmax(230px, 1fr)); gap: 14px; align-items: start; overflow-x: auto; }
.board-col { background: var(--panel); border: 1px solid var(--border-soft); border-radius: var(--radius); display: flex; flex-direction: column; min-height: 180px; transition: border-color .12s, background .12s; }
.board-col.over { border-color: var(--accent); background: rgba(56,189,248,.06); }
.board-col-head { display: flex; align-items: center; justify-content: space-between; padding: 11px 13px; border-bottom: 1px solid var(--border-soft); }
.board-col-head .count { font-size: 12px; font-weight: 700; color: var(--muted); background: var(--panel-2); padding: 1px 8px; border-radius: 999px; }
.board-col-body { display: flex; flex-direction: column; gap: 9px; padding: 11px; flex: 1; }
.board-empty { border: 1.5px dashed var(--border); border-radius: var(--radius-sm); padding: 18px; text-align: center; color: var(--muted); font-size: 12.5px; }
.board-empty:not(:empty) { color: transparent; }
.card { background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 11px; cursor: grab; display: flex; flex-direction: column; gap: 7px; transition: border-color .12s, transform .1s; }
.card:hover { border-color: var(--accent); }
.card.dragging { opacity: .45; }
.card-top { display: flex; justify-content: space-between; }
.card-title { margin: 0; font-size: 13.5px; font-weight: 600; line-height: 1.35; }
.card-bits { display: flex; flex-wrap: wrap; gap: 8px; }
.card-bit { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--muted); }

/* ---------- modal / dialog ---------- */
.overlay { position: fixed; inset: 0; background: rgba(4, 10, 22, 0.62); backdrop-filter: blur(3px); display: grid; place-items: center; z-index: 60; padding: 20px; animation: fade .15s ease; }
@keyframes fade { from { opacity: 0; } }
.dialog { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; width: min(680px, 96vw); max-height: 92vh; display: flex; flex-direction: column; box-shadow: var(--shadow); animation: pop .16s ease; }
.dialog.small { width: min(420px, 96vw); }
@keyframes pop { from { transform: translateY(8px) scale(.98); opacity: 0; } }
.dialog-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--border-soft); }
.dialog-head h3 { margin: 0; font-size: 16.5px; }
.dialog-body { padding: 18px; overflow-y: auto; }
.dialog-body p { margin: 0 0 6px; }
.dialog-foot { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--border-soft); }
.dialog-foot .spacer { flex: 1; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field.full { grid-column: 1 / -1; }
.field-label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.field-label em { color: var(--bad); font-style: normal; }

.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
.switch input { display: none; }
.switch .track { width: 40px; height: 22px; border-radius: 999px; background: var(--bg-2); border: 1px solid var(--border); position: relative; transition: background .15s; }
.switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
.switch input:checked + .track { background: rgba(56,189,248,.3); border-color: var(--accent); }
.switch input:checked + .track::after { transform: translateX(18px); background: var(--accent); }
.switch-label { font-size: 13px; color: var(--muted); }

/* ---------- toast ---------- */
.toast-host { position: fixed; bottom: 22px; right: 22px; display: flex; flex-direction: column; gap: 9px; z-index: 80; }
.toast { display: flex; align-items: center; gap: 9px; background: var(--panel-2); border: 1px solid var(--border); border-left: 3px solid var(--good); color: var(--text); padding: 11px 15px; border-radius: 10px; font-size: 13.5px; box-shadow: var(--shadow); animation: slidein .2s ease; }
.toast.error { border-left-color: var(--bad); }
.toast.error .icon { color: var(--bad); }
.toast.ok .icon { color: var(--good); }
.toast.out { opacity: 0; transform: translateX(12px); transition: all .3s; }
@keyframes slidein { from { opacity: 0; transform: translateX(20px); } }

/* ---------- global search results ---------- */
.search-results { position: fixed; z-index: 50; }
.search-panel { position: absolute; top: 64px; right: 20px; width: min(420px, 92vw); background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.search-hit { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; padding: 10px 14px; background: transparent; border: none; border-bottom: 1px solid var(--border-soft); color: var(--text); cursor: pointer; font-size: 13.5px; }
.search-hit:hover { background: var(--panel-2); }
.search-hit .icon { color: var(--accent); }
.hit-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hit-type { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.search-empty { padding: 14px; color: var(--muted); font-size: 13px; }
.popover { position: absolute; top: 64px; right: 20px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; min-width: 210px; }
.popover-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 11px; border: none; background: transparent; color: var(--text); border-radius: 8px; cursor: pointer; font-size: 13.5px; }
.popover-item:hover { background: var(--panel-2); }
.popover-item .icon { color: var(--accent); }

/* ---------- settings rows ---------- */
.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 13px 0; border-bottom: 1px solid var(--border-soft); flex-wrap: wrap; }
.setting-row:last-child { border-bottom: none; }
.row-actions { display: flex; align-items: center; gap: 9px; }

/* =========================================================================
   KIOSK / wall board
   ========================================================================= */
html[data-theme="kiosk"] {
  --bg: #05080f;
  --bg-2: #0a101d;
  --panel: #0d1526;
  --panel-2: #121d33;
  --border: #1e2c47;
  --border-soft: #17233a;
  --text: #eaf1fb;
  --muted: #8ea4c5;
  --accent: #38bdf8;
}
.kiosk-body { height: 100vh; overflow: hidden; background: radial-gradient(circle at 20% -10%, #12203b, #05080f 60%); }
.kiosk { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; padding: 18px 22px; gap: 16px; }
.kiosk-loading { color: var(--muted); font-size: 20px; margin: auto; }

.kiosk-header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.kiosk-brand { display: flex; align-items: center; gap: 14px; }
.kiosk-logo { width: 54px; height: 54px; border-radius: 14px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), #6366f1); color: #041022; }
.kiosk-shop { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
.kiosk-sub { font-size: 14px; color: var(--muted); }
.kiosk-center { text-align: center; }
.kiosk-view-title { font-size: 22px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.kiosk-dots { display: flex; gap: 7px; justify-content: center; margin-top: 8px; }
.kdot { width: 9px; height: 9px; border-radius: 999px; background: var(--border); cursor: pointer; transition: all .2s; }
.kdot.on { background: var(--accent); width: 26px; }
.kiosk-right { text-align: right; }
.kiosk-clock { font-size: 42px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1; }
.kiosk-date { font-size: 15px; color: var(--muted); margin-top: 4px; }
.kiosk-live { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; letter-spacing: .12em; margin-top: 8px; color: var(--good); }
.kiosk-live.bad { color: var(--bad); }
.kiosk-live .dot { width: 10px; height: 10px; }
.kiosk-live.ok .dot { background: var(--good); animation: softpulse 2s infinite; }
.kiosk-live.bad .dot { background: var(--bad); }

.kiosk-main { overflow: hidden; }

.k-overview { display: grid; grid-template-rows: auto 1fr; gap: 18px; height: 100%; }
.k-tiles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
.k-tile { background: var(--panel); border: 1px solid var(--border-soft); border-radius: 16px; padding: 18px 20px; position: relative; overflow: hidden; }
.k-tile::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); }
.k-tile.bad::before { background: var(--bad); }
.k-tile.warn::before { background: var(--warn); }
.k-tile-value { font-size: 54px; font-weight: 800; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.k-tile.bad .k-tile-value { color: #fca5a5; }
.k-tile.warn .k-tile-value { color: #fcd34d; }
.k-tile-label { font-size: 16px; color: var(--muted); margin-top: 8px; font-weight: 600; }

.k-panel { background: var(--panel); border: 1px solid var(--border-soft); border-radius: 16px; padding: 6px 0; overflow: hidden; display: flex; flex-direction: column; }
.k-panel.wide { height: 100%; }
.k-panel-head { display: flex; align-items: center; gap: 12px; padding: 16px 20px; font-size: 20px; font-weight: 700; border-bottom: 1px solid var(--border-soft); }
.k-panel-head .icon { color: var(--accent); }
.k-list { list-style: none; margin: 0; padding: 0; overflow: hidden; }
.k-list.big { overflow-y: auto; }
.k-row { display: flex; align-items: center; gap: 16px; padding: 14px 22px; border-bottom: 1px solid var(--border-soft); }
.k-row.bad { background: rgba(239,68,68,.06); }
.k-row.warn { background: rgba(245,158,11,.05); }
.k-row-body { flex: 1; min-width: 0; }
.k-row-title { font-size: 20px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.k-row-sub { font-size: 14px; color: var(--muted); margin-top: 3px; }
.k-row-owner { font-size: 15px; color: var(--muted); text-align: right; font-weight: 600; }
.k-date { font-size: 16px; font-weight: 700; color: var(--accent); min-width: 74px; font-variant-numeric: tabular-nums; }
.k-qty { font-size: 26px; font-weight: 800; min-width: 60px; text-align: center; color: var(--warn); font-variant-numeric: tabular-nums; }
.k-row.bad .k-qty { color: #fca5a5; }
.k-more { padding: 14px 22px; color: var(--muted); font-size: 15px; }

.k-board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; height: 100%; }
.k-col { background: var(--panel); border: 1px solid var(--border-soft); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; }
.k-col-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; font-size: 18px; font-weight: 700; border-bottom: 3px solid var(--chip, var(--accent)); color: var(--chip, var(--accent)); }
.k-count { background: var(--panel-2); color: var(--muted); border-radius: 999px; padding: 1px 12px; font-size: 15px; }
.k-col .k-card { margin: 12px 12px 0; }
.k-card { background: var(--panel-2); border: 1px solid var(--border); border-left: 4px solid var(--border); border-radius: 10px; padding: 13px 15px; }
.k-card.bad { border-left-color: var(--bad); }
.k-card-title { font-size: 16.5px; font-weight: 600; line-height: 1.3; }
.k-card-meta { display: flex; align-items: center; gap: 10px; margin-top: 9px; }
.k-chip { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; color: var(--chip); background: color-mix(in srgb, var(--chip) 16%, transparent); border: 1px solid color-mix(in srgb, var(--chip) 42%, transparent); }
.k-due { font-size: 13px; color: var(--muted); }
.k-card-sub { font-size: 13px; color: var(--muted); margin-top: 7px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.k-assets { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; align-content: start; height: 100%; overflow-y: auto; }
.k-asset { background: var(--panel); border: 1px solid var(--border-soft); border-left: 5px solid var(--good); border-radius: 14px; padding: 16px 18px; }
.k-asset.bad { border-left-color: var(--bad); background: rgba(239,68,68,.06); }
.k-asset.warn { border-left-color: var(--warn); background: rgba(245,158,11,.05); }
.k-asset-top { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.k-dot { width: 11px; height: 11px; border-radius: 50%; }
.k-asset-name { font-size: 20px; font-weight: 700; margin-top: 10px; }
.k-asset-sub { font-size: 14px; color: var(--muted); margin-top: 4px; }

.kiosk-ticker { display: flex; align-items: center; gap: 16px; border-top: 1px solid var(--border); padding-top: 12px; overflow: hidden; }
.ticker-label { font-size: 12px; font-weight: 800; letter-spacing: .16em; color: var(--accent); flex: none; }
.ticker-track { flex: 1; overflow: hidden; position: relative; height: 22px; }
.ticker-run { display: inline-flex; gap: 46px; white-space: nowrap; animation: marquee 40s linear infinite; position: absolute; }
.ticker-item { font-size: 14px; color: var(--muted); }
.ticker-item::before { content: "•"; color: var(--accent); margin-right: 10px; }
@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }

/* ---------- responsive ---------- */
@media (max-width: 1200px) {
  .kpi-row { grid-template-columns: repeat(3, 1fr); }
  .kpi-row-5, .kpi-row-3 { grid-template-columns: repeat(3, 1fr); }
  .k-tiles { grid-template-columns: repeat(3, 1fr); }
  .k-board { grid-template-columns: repeat(3, 1fr); }
  .k-assets { grid-template-columns: repeat(3, 1fr); }
  .k-board2 { grid-template-columns: 1fr 1fr; }
  .day-strip { grid-template-columns: repeat(4, 1fr); }
}
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: fixed; inset: 0 auto 0 0; width: 260px; z-index: 70; transform: translateX(-100%); transition: transform .2s; }
  .sidebar.open { transform: translateX(0); box-shadow: var(--shadow); }
  .menu-btn { display: inline-grid; }
  .global-search { display: none; }
  .grid-2, .settings-grid, .mini-kpis, .mini-kpis-3 { grid-template-columns: 1fr; }
  .board { grid-template-columns: repeat(2, minmax(200px, 1fr)); }
  .k-tiles, .k-board, .k-assets { grid-template-columns: repeat(2, 1fr); }
  .k-board2 { grid-template-columns: 1fr; }
  .day-strip { grid-template-columns: 1fr; }
  .weapon-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
  .kiosk-header { grid-template-columns: 1fr; text-align: center; }
  .kiosk-right { text-align: center; }
}

/* =========================================================================
   SHOP OPS — daily board, schedule, weapons, notes
   ========================================================================= */

.mono-time {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: .02em;
}

/* ---------- daily board ---------- */
.board-nav { margin-bottom: 0; }
.board-day-label { font-size: 15px; font-weight: 700; color: var(--muted); margin-left: 4px; }
.board-day-label.today { color: var(--good); letter-spacing: .06em; }

.board-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
.board-col { background: var(--panel); border: 1px solid var(--border-soft); border-radius: var(--radius); overflow: hidden; min-height: 220px; }
.board-col-title {
  display: flex; align-items: center; gap: 10px; padding: 13px 16px;
  font-size: 15px; font-weight: 800; letter-spacing: .08em; border-bottom: 3px solid var(--border-soft);
}
.board-col-title.in { color: #86efac; border-bottom-color: rgba(34, 197, 94, .55); }
.board-col-title.out { color: #fca5a5; border-bottom-color: rgba(239, 68, 68, .55); }
.board-col-title .icon { flex: none; }
.board-col-title .count { margin-left: auto; background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px; padding: 1px 11px; font-size: 13px; color: var(--muted); }
.col-sub { margin-left: 8px; font-weight: 500; letter-spacing: 0; text-transform: none; }
.board-col-body { display: flex; flex-direction: column; gap: 10px; padding: 12px; }
.board-empty-day { border: 1.5px dashed var(--border); border-radius: var(--radius-sm); padding: 26px 16px; text-align: center; color: var(--muted); font-size: 13px; }
.col-day-sep {
  display: flex; align-items: center; gap: 10px; margin: 4px 0 -3px;
  font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
}
.col-day-sep::before, .col-day-sep::after { content: ""; flex: 1; height: 1px; background: var(--border-soft); }
.col-day-sep.today { color: var(--good); }

.appt {
  background: var(--panel-2); border: 1px solid var(--border); border-left: 4px solid var(--accent);
  border-radius: var(--radius-sm); padding: 11px 13px; display: flex; flex-direction: column; gap: 7px;
}
.appt.dim { opacity: .62; }
.appt-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.appt-time { font-size: 17px; font-weight: 700; color: var(--text); }
.appt-unit { font-size: 15.5px; font-weight: 700; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.appt-items { list-style: none; margin: 0; padding: 0 0 0 2px; display: flex; flex-direction: column; gap: 3px; }
.appt-items li { font-size: 13.5px; color: var(--text); }
.appt-items b { color: var(--accent); font-variant-numeric: tabular-nums; }
.appt-notes { font-size: 12.5px; color: var(--muted); background: var(--bg-2); border-radius: 6px; padding: 6px 9px; }
.appt-actions { display: flex; align-items: center; gap: 7px; margin-top: 2px; flex-wrap: wrap; }

.mini-btn.good { color: #86efac; }
.mini-btn.good:hover { border-color: var(--good); }
.mini-btn.danger { color: #fca5a5; background: rgba(239, 68, 68, .1); border-color: rgba(239, 68, 68, .35); }
.mini-btn.danger:hover { border-color: var(--bad); }

.overdue-banner { background: rgba(239, 68, 68, .07); border: 1px solid rgba(239, 68, 68, .4); border-radius: var(--radius); padding: 12px 16px; }
.overdue-head { display: flex; align-items: center; gap: 10px; font-weight: 800; color: #fca5a5; font-size: 14px; letter-spacing: .04em; margin-bottom: 8px; }
.overdue-head .icon { color: var(--bad); }
.overdue-list { display: flex; flex-direction: column; gap: 6px; }
.overdue-row { display: flex; align-items: center; gap: 10px; background: var(--panel-2); border: 1px solid var(--border-soft); border-radius: 8px; padding: 7px 11px; font-size: 13.5px; }
.overdue-more { padding: 2px 4px; }

/* ---------- week strip ---------- */
.week-nav { align-items: center; }
.day-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; align-items: start; }
.day-card { background: var(--panel); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 150px; }
.day-card.today { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56, 189, 248, .14); }
.day-head { display: flex; align-items: center; justify-content: space-between; padding-bottom: 6px; border-bottom: 1px solid var(--border-soft); }
.day-card.today .day-head { border-bottom-color: rgba(56, 189, 248, .4); }
.day-name { font-size: 12.5px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.day-card.today .day-name { color: var(--accent); }
.day-head .count { font-size: 12px; font-weight: 700; background: var(--panel-2); border-radius: 999px; padding: 0 8px; }
.day-head .count.zero { color: var(--muted); opacity: .6; }
.day-chip {
  position: relative;
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; text-align: left;
  background: var(--panel-2); border: 1px solid var(--border); border-left: 3px solid var(--chip, var(--accent));
  border-radius: 7px; padding: 6px 8px; cursor: pointer; color: var(--text); transition: border-color .12s, background .12s;
}
.day-chip:hover { border-color: var(--chip, var(--accent)); background: var(--panel); }
.day-chip.dim { opacity: .55; }
.day-chip-time { font-size: 12px; font-weight: 700; color: var(--chip, var(--accent)); }
.day-chip-unit { font-size: 12.5px; font-weight: 600; line-height: 1.25; padding-right: 18px; }
.day-chip-items { font-size: 10.5px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.day-chip .icon { position: absolute; right: 6px; top: 6px; color: var(--chip, var(--accent)); opacity: .8; }
.day-empty { color: var(--border); text-align: center; margin-top: auto; }

/* ---------- weapons ---------- */
.weapon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.weapon-card {
  background: var(--panel); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 14px 16px;
  display: flex; flex-direction: column; gap: 8px; transition: border-color .12s;
}
.weapon-card:hover { border-color: var(--accent); }
.weapon-name { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14.5px; }
.weapon-name .icon { color: var(--accent); }
.weapon-count { font-size: 40px; font-weight: 800; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; color: var(--accent); }
.weapon-notes { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.weapon-actions { display: flex; align-items: center; gap: 5px; margin-top: auto; padding-top: 8px; border-top: 1px solid var(--border-soft); }

/* ---------- notes ---------- */
.note-composer { display: flex; gap: 10px; align-items: flex-start; }
.note-composer .input { flex: 1; }
.notes-list { display: flex; flex-direction: column; gap: 10px; }
.note-card {
  background: var(--panel); border: 1px solid var(--border-soft); border-left: 4px solid var(--accent);
  border-radius: var(--radius-sm); padding: 11px 14px; display: flex; flex-direction: column; gap: 6px;
}
.note-card.wide { border-left-width: 5px; }
.note-text { font-size: 14px; line-height: 1.45; white-space: pre-wrap; }
.note-foot { display: flex; align-items: center; gap: 8px; }
.note-strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }

/* ---------- equipment items editor ---------- */
.items-editor { display: flex; flex-direction: column; gap: 8px; }
.items-rows { display: flex; flex-direction: column; gap: 6px; }
.item-row { display: grid; grid-template-columns: 1.2fr 74px 1.6fr 30px; gap: 6px; align-items: center; }
.item-row .input { padding: 7px 9px; font-size: 13.5px; }
.items-foot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.btn.mini { padding: 5px 10px; font-size: 12.5px; }
.items-cell { font-size: 13px; }
.eqtype-wrap { margin-top: 12px; max-height: 180px; overflow-y: auto; }
.eqtype-list { display: flex; flex-wrap: wrap; gap: 8px; }
.eqtype-chip {
  display: inline-flex; align-items: center; gap: 2px; padding: 4px 6px 4px 11px; border-radius: 999px;
  background: var(--panel-2); border: 1px solid var(--border); font-size: 12.5px; font-weight: 600;
}

/* ---------- TBD time & welcome panel ---------- */
.time-control { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.time-control .input[type="time"] { max-width: 170px; }
.appt-time.tbd { color: var(--warn); font-size: 14px; letter-spacing: .06em; }
.welcome .welcome-tips { margin: 0 0 16px; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
.welcome .welcome-tips li { font-size: 14px; line-height: 1.5; color: var(--text); }
.welcome .welcome-tips code { font-family: var(--mono); font-size: 12.5px; background: var(--bg-2); padding: 1px 6px; border-radius: 5px; color: var(--info); }
.welcome .row-actions { flex-wrap: wrap; }

.data-table tr.row-done td { opacity: .55; }

/* =========================================================================
   KIOSK additions
   ========================================================================= */
.k-tiles-6 { grid-template-columns: repeat(6, 1fr); }
.k-board2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-content: start; overflow: hidden; }
.k-col2 .k-col-head { font-size: 20px; letter-spacing: .1em; }
.k-col-sub { padding: 8px 20px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--border-soft); }
.k-col2 .k-card, .k-col2 .k-appt { margin: 12px 14px 0; }
.k-appt {
  background: var(--panel-2); border: 1px solid var(--border); border-left: 5px solid var(--accent);
  border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;
}
.k-appt.bad { border-left-color: var(--bad); }
.k-appt.dim { opacity: .55; }
.k-appt-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.k-appt-time { font-size: 24px; font-weight: 800; color: var(--accent); }
.k-appt-unit { font-size: 21px; font-weight: 700; }
.k-appt-items { display: flex; flex-direction: column; gap: 2px; font-size: 15px; }
.k-appt-items b { color: var(--accent); }
.k-appt-notes { font-size: 13px; color: var(--muted); background: var(--bg-2); border-radius: 8px; padding: 7px 10px; }
.k-appt-date { margin-left: auto; font-family: var(--mono); font-size: 13px; color: var(--muted); }
.k-overdue-bar {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 12px;
  background: rgba(239, 68, 68, .1); border: 1px solid rgba(239, 68, 68, .45); border-radius: 12px;
  padding: 12px 18px; color: #fca5a5; font-weight: 700; font-size: 15px; letter-spacing: .02em;
}
.k-overdue-bar .icon { color: var(--bad); flex: none; }
.k-day-row { padding: 12px 22px 4px; font-size: 15px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.k-notes .k-note-num { font-size: 22px; font-weight: 800; color: var(--accent); min-width: 34px; text-align: right; }
.k-note-text { font-size: 19px; line-height: 1.4; white-space: pre-wrap; }
.k-weapons { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; align-content: start; overflow-y: auto; }
.k-weapon {
  background: var(--panel); border: 1px solid var(--border-soft); border-left: 5px solid var(--accent);

// Single source of truth for the data model.
// Imported by the Node server (for validation + type coercion) and by the
// browser client (for rendering tables, forms and boards).

// The shop runs on four core collections:
//   appointments - scheduled drop-offs / pickups, by unit + equipment type
//   units        - the roster of units that visit the shop (with POCs)
//   weapons      - arms-room inventory, counted by weapon type
//   notes        - the shop notes board
// plus `eqtypes`, the equipment-type dictionary used for suggestions.

const TYPES = {
  TEXT: 'text',
  TEXTAREA: 'textarea',
  NUMBER: 'number',
  CURRENCY: 'currency',
  DATE: 'date',
  TIME: 'time',
  SELECT: 'select',

  BOOL: 'bool',
  URL: 'url',
  EMAIL: 'email',
  TEL: 'tel',

// (pickup). Life-cycle of an appointment on the board.

const STATUSES = ['Scheduled', 'Arrived', 'Completed', 'No-show', 'Cancelled'];

// A small palette used for status/direction chips in the UI.
const COLORS = {
  // appointment status
  Scheduled: '#0ea5e9',
  Arrived: '#f59e0b',
  Completed: '#22c55e',
  'No-show': '#ef4444',
  Cancelled: '#64748b',
  // flow direction
  'Drop-off': '#22c55e',
  Pickup: '#ef4444',
};

const collections = [
  {
    name: 'appointments',
    label: 'Appointments',
    singular: 'Appointment',
    icon: 'calendar',
    primary: 'unitId',
    titleOf: (r) => {

    },
    defaultSort: { key: 'date', dir: 'asc' },
    statusKey: 'status',
    cardBits: [
      { key: 'direction', chip: true },

    fields: [

      { key: 'time', label: 'Time', type: TYPES.TIME, default: '09:00', tbd: true },

      { key: 'notes', label: 'Notes', type: TYPES.TEXTAREA, table: false },
    ],
  },
  {
    name: 'units',
    label: 'Units',
    singular: 'Unit',
    icon: 'people',
    primary: 'name',
    defaultSort: { key: 'name', dir: 'asc' },
    fields: [
      { key: 'name', label: 'Unit', type: TYPES.TEXT, required: true, width: 'wide' },

      { key: 'phone', label: 'Phone', type: TYPES.TEL },
      { key: 'notes', label: 'Notes', type: TYPES.TEXTAREA, table: false },
    ],
  },
  {
    name: 'weapons',
    label: 'Weapons',
    singular: 'Weapon',
    icon: 'target',
    primary: 'name',
    defaultSort: { key: 'name', dir: 'asc' },
    fields: [
      { key: 'name', label: 'Weapon Type', type: TYPES.TEXT, required: true, width: 'wide' },
      { key: 'count', label: 'On Hand', type: TYPES.NUMBER, step: 1, default: 0 },

  },

    singular: 'Equipment Type',
    icon: 'tag',
    primary: 'name',
    defaultSort: { key: 'name', dir: 'asc' },
    fields: [
      { key: 'name', label: 'Type', type: TYPES.TEXT, required: true, width: 'wide' },
    ],
  },

const collectionByName = Object.fromEntries(collections.map((c) => [c.name, c]));

// Which fields get type-coerced on the server before persisting.
function coerceValue(field, value) {
  if (value === null || value === undefined || value === '') {
    if (field.type === TYPES.NUMBER || field.type === TYPES.CURRENCY) return null;
    if (field.type === TYPES.BOOL) return false;
    if (field.type === TYPES.ITEMS) return [];
    return value === undefined ? '' : value;
  }
  switch (field.type) {
    case TYPES.NUMBER:
    case TYPES.CURRENCY: {
      const n = Number(value);
      return Number.isFinite(n) ? n : null;
    }
    case TYPES.BOOL:
      return value === true || value === 'true' || value === 1 || value === '1';
    case TYPES.ITEMS:
      return normalizeItems(value);
    default:
      return String(value);
  }
}

// Equipment lines on an appointment: [{ eqType, qty, description }].
function normalizeItems(value) {
  if (!Array.isArray(value)) return [];
  return value
    .map((raw) => {
      if (raw === null || raw === undefined) return null;
      if (typeof raw === 'string') return { eqType: raw.trim(), qty: 1, description: '' };
      const qty = Math.max(1, Math.min(9999, Math.round(Number(raw.qty) || 1)));
      return {
        eqType: String(raw.eqType ?? '').trim(),
        qty,
        description: String(raw.description ?? '').trim(),
      };
    })
    .filter((it) => it && (it.eqType || it.description))
    .slice(0, 50);
}

// Human summary of an item list, e.g. "2× Generator · 1× Radio ASIP".
function itemSummary(items) {
  return normalizeItems(items)
    .map((it) => {
      const desc = it.description ? ` — ${it.description}` : '';
      return `${it.qty}× ${it.eqType || 'Equipment'}${desc}`;
    })
    .join(' · ');
}

function titleOf(collectionName, record) {
  const meta = collectionByName[collectionName];
  if (!meta) return record?.id || '';
  if (meta.titleOf) return meta.titleOf(record);
  return record[meta.primary] || record.name || record.message || record.id;
}

// Appointment helpers -------------------------------------------------------

// The appointment's unit name, resolved through the units collection.
function unitNameOf(record, units = []) {
  if (record.unitName) return record.unitName;
  const unit = units.find((u) => u.id === record.unitId);
  return unit ? unit.name : '';
}

// Is a scheduled appointment past due? (date/time in the past, still "Scheduled")
function isApptOverdue(record, now = new Date()) {
  if (record.status !== 'Scheduled' || !record.date) return false;
  const p2 = (n) => String(n).padStart(2, '0');
  const nowKey = `${now.getFullYear()}-${p2(now.getMonth() + 1)}-${p2(now.getDate())} ${p2(now.getHours())}:${p2(now.getMinutes())}`;
  const key = `${record.date} ${record.time || '23:59'}`;
  return key < nowKey;
}

// Compute the derived fields (used by the client and available to the server).
function computeFields(collectionName, item) {
  const out = {};
  if (collectionName === 'appointments') {
    out.totalQty = normalizeItems(item.items).reduce((n, it) => n + it.qty, 0);
    out.itemCount = normalizeItems(item.items).length;
    out.overdue = isApptOverdue(item);
  }
  return out;
}

const settingsSchema = [
  { key: 'shopName', label: 'Shop name', type: TYPES.TEXT, default: 'Shop Ops' },
  { key: 'shopSubtitle', label: 'Shop subtitle / location', type: TYPES.TEXT, default: 'Drop-off & Pickup · Arms Room · Shop Notes' },
  { key: 'rotateSeconds', label: 'Wall board rotation (seconds)', type: TYPES.NUMBER, default: 14 },
  { key: 'kioskViews', label: 'Wall board views', type: TYPES.TEXT, default: 'board,schedule,weapons,notes' },

const KIOSK_VIEWS = {

  overview: 'Shop Overview',

})();

const __mod_shared_legacy_js = (() => {

// Legacy import: migrate data from the old Streamlit shop tracker.
// The old app used three CSV files with these shapes:
//
//   equipment.csv   TIME,Unit,Equipment,Direction,Notes
//                   TIME is "MM/DD HH:MM"; Equipment may hold several lines.
//   weapons.csv     Weapon,Count
//   shop_notes.csv  Message
//
// Everything here is pure (no DOM, no fetch) so it can be unit-tested in Node
// and reused by the browser importer.

function parseCsv(text) {
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  const src = String(text ?? '').replace(/^\uFEFF/, '');
  let i = 0;
  const push = () => {
    row.push(field);
    field = '';
  };
  const endRow = () => {
    // Drop truly blank lines (no cells, or the leftover of a trailing newline).
    if (row.length && !(row.length === 1 && row[0] === '')) rows.push(row);
    row = [];
  };
  while (i < src.length) {
    const c = src[i];
    if (inQuotes) {
      if (c === '"') {
        if (src[i + 1] === '"') { field += '"'; i += 2; continue; }
        inQuotes = false; i += 1; continue;
      }
      field += c; i += 1; continue;
    }
    if (c === '"') { inQuotes = true; i += 1; continue; }
    if (c === ',') { push(); i += 1; continue; }
    if (c === '\r') { i += 1; continue; }
    if (c === '\n') { push(); endRow(); i += 1; continue; }
    field += c; i += 1;
  }
  push();
  endRow();
  return rows;
}

function rowsToObjects(rows) {
  if (!rows.length) return [];
  const header = rows[0].map((h) => h.trim().toLowerCase());
  return rows.slice(1).map((cells) => {
    const obj = {};
    header.forEach((key, i) => { obj[key] = (cells[i] ?? '').trim(); });
    return obj;
  });
}

function pad(n) { return String(n).padStart(2, '0'); }

// "MM/DD HH:MM" (optionally "MM/DD/YYYY HH:MM", time optional) -> { date, time }
// Legacy files usually carry no year: use the current year, but if that would
// land more than ~9 months in the future assume the entry belongs to last year.
function parseLegacyTime(raw, today = new Date()) {
  const out = { date: '', time: '09:00' };
  const text = String(raw ?? '').trim();
  if (!text) return out;
  const m = text.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\s*,?\s*(?:(\d{1,2}):(\d{2}))?/);
  if (!m) return out;
  const month = Number(m[1]);
  const day = Number(m[2]);
  let year = m[3] ? Number(m[3]) : null;
  if (year !== null && year < 100) year += 2000;
  if (m[4] !== undefined) out.time = `${pad(Number(m[4]) % 24)}:${pad(Number(m[5]))}`;
  if (!(month >= 1 && month <= 12 && day >= 1 && day <= 31)) return out;

  if (year === null) {
    year = today.getFullYear();
    const candidate = new Date(year, month - 1, day, 12);
    const diffDays = (candidate.getTime() - new Date(today.getFullYear(), today.getMonth(), today.getDate(), 12).getTime()) / 86400000;
    if (diffDays > 270) year -= 1; // stale rows from last year
  }
  out.date = `${year}-${pad(month)}-${pad(day)}`;
  return out;
}

const DIRECTION_MAP = {
  incoming: 'Drop-off', inbound: 'Drop-off', dropoff: 'Drop-off', 'drop-off': 'Drop-off',
  outgoing: 'Pickup', outbound: 'Pickup', pickup: 'Pickup', 'pick-up': 'Pickup',
};

function mapDirection(raw) {
  return DIRECTION_MAP[String(raw ?? '').trim().toLowerCase()] || 'Drop-off';
}

// Split a legacy "Equipment" cell (one line per item) into item objects.
// Quantities need an explicit marker ("Generator x3" / "Radio ×2") so serial
// numbers like "MEP-803A #7" or "Trailer 3" stay untouched.
function parseEquipmentLines(raw) {
  return String(raw ?? '')
    .split(/\r?\n|;+/)
    .map((line) => line.trim())
    .filter(Boolean)
    .map((line) => {
      const m = line.match(/^(.*?)(?:\s+[xX×]\s*|\s*×\s*)(\d{1,4})$/);
      if (m && m[1].trim()) {
        return { eqType: m[1].trim().replace(/[,;]$/, ''), qty: Math.min(9999, Number(m[2])), description: '' };
      }
      return { eqType: line.replace(/[,;]$/, ''), qty: 1, description: '' };
    })
    .slice(0, 50);
}

function isoOf(d) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

/**
 * Detect the kind of CSV from its header and map it onto this app's records.
 * Returns { kind, records, warnings } or null when the header is unrecognized.
 */
function mapLegacyCsv(text, today = new Date()) {
  const rows = rowsToObjects(parseCsv(text));
  if (!rows.length) return null;
  const keys = Object.keys(rows[0]);
  const has = (k) => keys.includes(k);
  const warnings = [];

  if (has('time') && has('unit') && has('equipment')) {
    const records = [];
    for (const row of rows) {
      const { date, time } = parseLegacyTime(row['time'], today);
      const unit = (row['unit'] || '').trim();
      const equipment = row['equipment'] ?? '';
      const notes = (row['notes'] || '').trim();
      const direction = mapDirection(row['direction']);
      if (!unit && !equipment) continue;
      const items = parseEquipmentLines(equipment);
      if (!items.length && unit) { /* keep unit-only appointment */ }
      if (!date) warnings.push(`Unreadable time "${row['time']}" — defaulted date`);
      const status = date && date < isoOf(today) ? 'Completed' : 'Scheduled';
      records.push({ date: date || isoOf(today), time, unitId: unit, direction, status, items, poc: '', notes });
    }
    return { kind: 'appointments', records, warnings };
  }

  if (has('weapon')) {
    const records = [];
    for (const row of rows) {
      const name = (row['weapon'] || '').trim();
      if (!name) continue;
      const count = Math.max(0, Math.round(Number(row['count']) || 0));
      records.push({ name, count, notes: (row['notes'] || '').trim() });
    }
    return { kind: 'weapons', records, warnings };
  }

  if (has('message')) {
    const records = [];
    for (const row of rows) {
      const message = (row['message'] || '').trim();
      if (!message) continue;
      records.push({ message });
    }
    return { kind: 'notes', records, warnings };
  }

  return null;
}

/** Map several CSV files at once: [{ name, text }] -> combined payload. */
function importLegacyCsvFiles(files, today = new Date()) {
  const payload = { appointments: [], weapons: [], notes: [], warnings: [], detected: [] };
  for (const file of files || []) {
    try {
      const mapped = mapLegacyCsv(file.text, today);
      if (!mapped) {
        payload.warnings.push(`${file.name}: unrecognized columns — skipped`);
        continue;
      }
      payload.detected.push(`${file.name} → ${mapped.kind} (${mapped.records.length} rows)`);
      payload[mapped.kind].push(...mapped.records);
      payload.warnings.push(...mapped.warnings.map((w) => `${file.name}: ${w}`));
    } catch (err) {
      payload.warnings.push(`${file.name}: ${err.message}`);
    }
  }
  // De-duplicate weapon names (last one wins) and note texts.
  payload.weapons = [...new Map(payload.weapons.map((r) => [r.name.toLowerCase(), r])).values()];
  payload.notes = [...new Set(payload.notes.map((r) => r.message))].map((message) => ({ message }));
  return payload;
}
  return { parseCsv, rowsToObjects, parseLegacyTime, mapDirection, parseEquipmentLines, mapLegacyCsv, importLegacyCsvFiles };
})();

      }
      return fmtDateShort(raw) || h('span', { class: 'muted' }, '—');
    }
    case TYPES.TIME:
      if (String(raw ?? '').toUpperCase() === 'TBD') return h('span', { class: 'badge warn' }, 'TBD');

    case TYPES.NUMBER:
      return raw === null || raw === undefined || raw === '' ? h('span', { class: 'muted' }, '—') : String(raw);
    default:

function editableCell(collection, record, field) {
  const td = h('td', { class: `${field.width === 'wide' ? 'wide' : ''} editable`, tabindex: '0' });
  const render = () => {
    clear(td);
    td.append(displayValue(field, record));
  };
  td.append(displayValue(field, record));

  const enterEdit = () => {
    if (field.type === 'computed') return;
    const input = inlineControl(field, record[field.key]);
    clear(td);
    td.append(input);
    input.focus();
    if (input.select) input.select();

    let done = false;
    const commit = async (save) => {
      if (done) return;
      done = true;
      const value = readInput(input);
      render();
      if (save && String(value) !== String(record[field.key] ?? '')) {
        try {
          await store.save(collection, record.id, { [field.key]: value });
        } catch (err) {
          toast(err.message, 'error');
        }
      }
    };
    input.addEventListener('blur', () => commit(true));
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
      if (e.key === 'Escape') { e.preventDefault(); done = true; render(); }
    });
    if (input.tagName === 'SELECT') input.addEventListener('change', () => commit(true));
  };

  td.addEventListener('click', (e) => {
    if (td.classList.contains('editing')) return;
    if (e.target.closest('.icon-btn')) return;
    enterEdit();
  });
  td.addEventListener('keydown', (e) => { if (e.key === 'Enter') enterEdit(); });
  return td;
}

function inlineControl(field, value) {
  const input = fieldControl(field, value);
  input.classList.add('inline-input');
  return input;
}

function workBoard({ collection = 'appointments', onOpen }) {
  const meta = collectionByName[collection];
  const statusField = meta.fields.find((f) => f.key === meta.statusKey);
  const columns = statusField.options;
  const board = h('div', { class: 'board' });
  const all = store.col(collection);

  for (const status of columns) {
    const cards = all.filter((r) => (r[meta.statusKey] || columns[0]) === status);
    const columnEl = h('div', { class: 'board-col', dataset: { status } });
    columnEl.append(h('div', { class: 'board-col-head' },
      statusChip(status),
      h('span', { class: 'count' }, cards.length),
    ));
    const bodyEl = h('div', { class: 'board-col-body' });
    for (const record of cards) bodyEl.append(boardCard(meta, record, onOpen));
    bodyEl.append(h('div', { class: 'board-empty' }, cards.length ? '' : 'Drop here'));
    columnEl.append(bodyEl);
    enableDropTarget(columnEl, meta, status);
    board.append(columnEl);
  }
  return board;
}

function boardCard(meta, record, onOpen) {
  const card = h('article', { class: 'card', draggable: 'true', dataset: { id: record.id } });
  // Top chip: priority if the collection has one, otherwise direction.
  const topVal = record.priority || record.direction;
  if (topVal) card.append(h('div', { class: 'card-top' }, statusChip(topVal)));
  card.append(h('h4', { class: 'card-title' }, titleOf(meta.name, record)));
  const bits = [];
  for (const bit of meta.cardBits || []) {
    const value = record[bit.key];
    if (value === '' || value === null || value === undefined) continue;
    if (bit.chip && value !== topVal) {
      bits.push(h('span', { class: 'card-bit' }, statusChip(value)));
      continue;
    }
    if (bit.items) {
      const summary = itemSummary(value);
      if (summary) bits.push(h('span', { class: 'card-bit wide' }, icon('box', 13), summary));
      continue;
    }
    if (bit.icon) bits.push(h('span', { class: 'card-bit' }, icon(bit.icon, 13), bit.date ? fmtDateShort(value) : String(value)));
  }
  if (bits.length) card.append(h('div', { class: 'card-bits' }, bits));
  if (record.date) {
    const d = daysUntil(record.date);
    if (d !== null && d < 0 && record.status === 'Scheduled') card.append(dueBadge(d));
    else if (d === 0) card.append(dueBadge(0));
  }
  card.addEventListener('dragstart', (e) => {
    e.dataTransfer.setData('text/plain', record.id);
    e.dataTransfer.effectAllowed = 'move';
    card.classList.add('dragging');
  });
  card.addEventListener('dragend', () => card.classList.remove('dragging'));
  card.addEventListener('click', () => onOpen?.(record));
  return card;
}

function enableDropTarget(columnEl, meta, status) {
  columnEl.addEventListener('dragover', (e) => {
    e.preventDefault();
    columnEl.classList.add('over');
  });
  columnEl.addEventListener('dragleave', () => columnEl.classList.remove('over'));
  columnEl.addEventListener('drop', async (e) => {
    e.preventDefault();
    columnEl.classList.remove('over');
    const id = e.dataTransfer.getData('text/plain');
    const record = store.byId(meta.name, id);
    if (!record || record[meta.statusKey] === status) return;
    try {
      await store.save(meta.name, id, { [meta.statusKey]: status });
      if (status === 'Done') toast(`"${record[meta.primary]}" marked done`);
    } catch (err) {
      toast(err.message, 'error');
    }
  });
}

function matchesSearch(record, meta, query) {
  if (!query) return true;
  const q = query.toLowerCase();
  for (const field of meta.fields) {
    const value = record[field.key];
    if (value === null || value === undefined) continue;
    const text = field.type === TYPES.ITEMS ? itemSummary(value) : String(value);

    if (field.type === TYPES.REF) {

            class: 'mini-btn', title: 'Push one day forward',
            onclick: async () => { await store.save('appointments', r.id, { date: shiftDays(r.date, 1) }); toast('Moved to next day'); },
          }, icon('move', 14), '+1 day'),
          iconButton('edit', () => openForm({ collection: 'appointments', record: r }), 'Edit'),
        )),
        overdue.length > 6 ? h('div', { class: 'muted small overdue-more' }, `+${overdue.length - 6} more — see Schedule`) : null,
      ),
    );
    root.append(banner);
  }

  // Inbound / outbound columns
  const columns = h('div', { class: 'board-cols' });
  const makeCol = (title, sub, dirIcon, tone, cards) => {
    const col = h('div', { class: 'board-col' });
    col.append(h('div', { class: `board-col-title ${tone}` }, icon(dirIcon, 18), h('span', {}, title), h('span', { class: 'count' }, cards.length), h('span', { class: 'muted small col-sub' }, sub)));
    const body = h('div', { class: 'board-col-body' });
    if (!cards.length) {
      body.append(h('div', { class: 'board-empty-day' }, history
        ? `Nothing ${tone === 'in' ? 'dropping off' : 'being picked up'} on this date.`
        : `No open ${tone === 'in' ? 'drop-offs' : 'pickups'} — new ones appear here the moment they're scheduled.`));
    }
    let lastDate = '';
    for (const r of cards) {
      // Planning mode groups the pipeline by day so upcoming visits read at a glance.
      if (!history && r.date !== lastDate) {
        lastDate = r.date;
        body.append(h('div', { class: `col-day-sep ${r.date === today ? 'today' : ''}` }, r.date === today ? 'TODAY' : fmtDayStrip(r.date)));
      }
      body.append(apptCard(r, { planning: !history }));
    }
    col.append(body);
    return col;
  };
  columns.append(makeCol('INBOUND', history ? 'units dropping equipment off' : 'from scheduled until dropped off', 'arrowdown', 'in', inbound));
  columns.append(makeCol('OUTBOUND', history ? 'units picking equipment up' : 'from scheduled until picked up', 'arrowup', 'out', outbound));
  root.append(columns);

  // Shop notes strip
  const notes = store.col('notes').slice(0, 6);
  if (notes.length) {
    const panel = h('div', { class: 'panel' });
    panel.append(h('div', { class: 'panel-head' },
      icon('note', 17), h('h3', {}, 'Shop Notes'),
      h('span', { class: 'spacer' }),
      h('button', { class: 'btn ghost mini', onclick: () => { location.hash = '#/notes'; } }, 'All notes'),
    ));
    const grid = h('div', { class: 'note-strip' });
    for (const n of notes) {
      grid.append(h('div', { class: 'note-card' },
        h('div', { class: 'note-text' }, n.message),
        h('div', { class: 'muted small' }, relTime(n.createdAt)),
      ));
    }
    panel.append(h('div', { class: 'panel-body' }, grid));
    root.append(panel);
  }

  return root;
}

// ---- Schedule (appointments) ----------------------------------------------
function appointmentsView(ctx) {
  const u = ui(ctx, 'appointments', {
    mode: 'week', search: '', status: '', direction: '', unit: '',
    weekStart: weekStart(todayIso()), sort: { key: 'date', dir: 'asc' },
  });
  const meta = collectionByName.appointments;
  const root = h('div', { class: 'view' });

  root.append(sectionHeader('Schedule', 'Drop-offs and pickups by unit and equipment type',
    h('div', { class: 'segmented' },
      h('button', { class: `seg ${u.mode === 'week' ? 'active' : ''}`, onclick: () => { u.mode = 'week'; ctx.rerender(); } }, icon('calendar', 15), 'Week'),
      h('button', { class: `seg ${u.mode === 'board' ? 'active' : ''}`, onclick: () => { u.mode = 'board'; ctx.rerender(); } }, icon('grid', 15), 'Status Board'),
      h('button', { class: `seg ${u.mode === 'table' ? 'active' : ''}`, onclick: () => { u.mode = 'table'; ctx.rerender(); } }, icon('list', 15), 'Table'),
    ),
    addButton('appointments'),
  ));

  root.append(toolbar(ctx, 'appointments', {
    searchPlaceholder: 'Search unit, equipment, notes…',
    filters: [
      { key: 'unit', label: 'All units', options: store.options('units') },
      { key: 'direction', label: 'All flows', options: DIRECTIONS.map((v) => ({ value: v, label: v })) },
      { key: 'status', label: 'All statuses', options: STATUSES.map((v) => ({ value: v, label: v })) },
    ],
  }));

  let items = withComputed(store.col('appointments')).filter((r) => matchesSearch(r, meta, u.search));
  if (u.status) items = items.filter((r) => r.status === u.status);
  if (u.direction) items = items.filter((r) => r.direction === u.direction);
  if (u.unit) items = items.filter((r) => r.unitId === u.unit);
  const allCount = items.length;

  const body = h('div', { class: 'view-body' });

  if (u.mode === 'week') {
    // Week navigation
    body.append(h('div', { class: 'toolbar week-nav' },
      h('div', { class: 'toolbar-left' },
        h('button', { class: 'btn ghost', onclick: () => { u.weekStart = shiftDays(u.weekStart, -7); ctx.rerender(); } }, icon('chevron', 16), 'Prev week'),
        h('button', { class: 'btn', onclick: () => { u.weekStart = weekStart(todayIso()); ctx.rerender(); } }, 'This week'),
        h('button', { class: 'btn ghost', onclick: () => { u.weekStart = shiftDays(u.weekStart, 7); ctx.rerender(); } }, 'Next week', icon('chevron', 16)),
      ),
      h('span', { class: 'muted small' }, `${fmtDayStrip(u.weekStart)} – ${fmtDayStrip(shiftDays(u.weekStart, 6))} · drag cards on the Status Board to change status`),
    ));

    // Filters apply to the strip as well
    const weekItems = items;
    const days = [...Array(7)].map((_, i) => shiftDays(u.weekStart, i));
    const strip = h('div', { class: 'day-strip' });
    for (const dayIso of days) {
      const dayAppts = weekItems
        .filter((r) => r.date === dayIso && r.status !== 'Cancelled')
        .sort(byTime);
      const isToday = dayIso === todayIso();
      const card = h('div', { class: `day-card ${isToday ? 'today' : ''}` });
      card.append(h('div', { class: 'day-head' },
        h('span', { class: 'day-name' }, fmtDayStrip(dayIso)),
        h('span', { class: `count ${dayAppts.length ? '' : 'zero'}` }, dayAppts.length),
      ));
      for (const r of dayAppts) {
        const dirIcon = r.direction === 'Drop-off' ? 'arrowdown' : 'arrowup';
        card.append(h('button', {
          class: `day-chip ${r.status === 'Completed' ? 'dim' : ''}`,
          style: { '--chip': COLORS[r.direction] },
          title: `${r.time} ${unitLabel(r)} — ${itemSummary(r.items) || 'no equipment listed'}`,
          onclick: () => openForm({ collection: 'appointments', record: r }),
        },
          h('span', { class: 'day-chip-time mono-time' }, r.time),
          h('span', { class: 'day-chip-unit' }, unitLabel(r)),
          h('span', { class: 'day-chip-items muted small' }, itemSummary(r.items) || '—'),
          icon(dirIcon, 13),
        ));
      }
      if (!dayAppts.length) card.append(h('div', { class: 'day-empty' }, '—'));
      strip.append(card);
    }
    body.append(strip);
  } else if (u.mode === 'board') {
    body.append(workBoard({ collection: 'appointments', onOpen: (record) => openForm({ collection: 'appointments', record }) }));
  } else {
    items = sortItems(items, u.sort, { date: (r) => `${r.date || ''} ${r.time || ''}` });
    body.append(h('div', { class: 'table-wrap' }, dataTable({
      collection: 'appointments',
      items,
      sort: u.sort,
      onSort: (key) => { u.sort = { key, dir: u.sort?.key === key && u.sort.dir === 'asc' ? 'desc' : 'asc' }; ctx.rerender(); },
      extraActions: (r) => statusActions(r).slice(0, 1),
      rowClass: (r) => r.overdue ? 'row-bad' : r.status === 'Arrived' ? 'row-warn' : r.status === 'Completed' ? 'row-done' : '',
    })));
  }

  root.append(body);
  root.append(h('div', { class: 'muted small' }, `${allCount} appointment${allCount === 1 ? '' : 's'} shown`));
  return root;
}

// ---- Weapons ---------------------------------------------------------------
function weaponsView(ctx) {
  const u = ui(ctx, 'weapons', { search: '' });
  const root = h('div', { class: 'view' });
  const weapons = store.col('weapons');
  const total = weapons.reduce((n, w) => n + (Number(w.count) || 0), 0);
  const biggest = [...weapons].sort((a, b) => (Number(b.count) || 0) - (Number(a.count) || 0))[0];

  root.append(sectionHeader('Weapons', 'Arms-room inventory by weapon type',
    h('button', { class: 'btn primary', onclick: () => openForm({ collection: 'weapons' }) }, icon('plus', 16), 'Add Weapon Type'),
  ));

  // Quick add row
  const nameInput = h('input', { class: 'input', placeholder: 'Weapon type — e.g. M4 Carbine' });
  const countInput = h('input', { class: 'input compact', type: 'number', min: '0', step: '1', placeholder: 'Count', style: { maxWidth: '110px' } });
  const quickAdd = h('div', { class: 'toolbar' },
    h('div', { class: 'toolbar-left' },
      h('span', { class: 'search-wrap' }, icon('target', 16), nameInput),
      countInput,
      h('button', {
        class: 'btn primary', onclick: async () => {
          const name = nameInput.value.trim();
          if (!name) { toast('Give the weapon type a name', 'error'); nameInput.focus(); return; }
          await store.save('weapons', null, { name, count: Math.max(0, Math.round(Number(countInput.value) || 0)) });
          toast(`Added ${name}`);
          nameInput.value = ''; countInput.value = '';
          ctx.rerender();
        },
      }, icon('plus', 16), 'Add'),
    ),
  );
  root.append(quickAdd);

  root.append(h('div', { class: 'kpi-row kpi-row-3' },
    kpi('Types Tracked', weapons.length, weapons.length ? 'accent' : ''),
    kpi('Total On Hand', total, total ? '' : 'warn', 'all weapon types'),
    kpi('Largest Type', biggest ? biggest.count : 0, '', biggest ? biggest.name : '—'),
  ));

  // Distribution chart
  if (weapons.length) {
    const chart = h('div', { class: 'panel' });
    chart.append(h('div', { class: 'panel-head' }, icon('activity', 17), h('h3', {}, 'Count by Weapon Type')));
    chart.append(barChart([...weapons]
      .sort((a, b) => (Number(b.count) || 0) - (Number(a.count) || 0))
      .map((w) => ({ label: w.name, value: Number(w.count) || 0, color: 'var(--accent)' }))));
    root.append(chart);
  }

  // Search + card grid
  const q = (u.search || '').toLowerCase();
  const list = weapons
    .filter((w) => !q || String(w.name).toLowerCase().includes(q) || String(w.notes || '').toLowerCase().includes(q))
    .sort((a, b) => String(a.name).localeCompare(String(b.name), undefined, { numeric: true }));

  if (!weapons.length) {
    root.append(h('div', { class: 'panel' }, h('div', { class: 'panel-body muted' },
      'No weapon types yet — add the first one above. Use −/＋ on each card to adjust counts as arms are signed in and out.')));
  } else if (!list.length) {
    root.append(h('div', { class: 'panel' }, h('div', { class: 'panel-body muted' }, `No weapon types match "${u.search}".`)));
  } else {
    const grid = h('div', { class: 'weapon-grid' });
    for (const w of list) {
      const card = h('div', { class: 'weapon-card', dataset: { id: w.id } });
      card.append(h('div', { class: 'weapon-name' }, icon('target', 15), w.name));
      card.append(h('div', { class: 'weapon-count' }, String(Number(w.count) || 0)));
      if (w.notes) card.append(h('div', { class: 'weapon-notes muted small', title: w.notes }, w.notes));
      const actions = h('div', { class: 'weapon-actions' },
        iconButton('minus', async () => {
          await store.save('weapons', w.id, { count: Math.max(0, (Number(w.count) || 0) - 1) });
        }, 'Remove one'),
        h('span', { class: 'muted small' }, 'on hand'),
        iconButton('plus', async () => {
          await store.save('weapons', w.id, { count: (Number(w.count) || 0) + 1 });
        }, 'Add one'),
        h('span', { class: 'spacer' }),
        iconButton('edit', () => openForm({ collection: 'weapons', record: w }), 'Edit'),
        iconButton('trash', async () => {
          if (await confirmDialog({ title: `Delete ${w.name}?`, message: 'The weapon type and its count will be removed.' })) {
            await store.remove('weapons', w.id);
            toast('Deleted');
          }
        }, 'Delete', 'danger-hover'),
      );
      card.append(actions);
      grid.append(card);
    }
    root.append(grid);
  }
  return root;
}

function notesView(ctx) {

  const notes = store.col('notes');

  root.append(sectionHeader('Shop Notes', 'The pass-down board — everything the shop needs to remember'));

      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      await store.save('notes', null, { message });
      toast('Note posted');
      input.value = '';
      ctx.rerender();
    },
  }, input, h('button', { class: 'btn primary', type: 'submit' }, icon('pin', 16), 'Post Note'));

  const list = h('div', { class: 'notes-list' });

    list.append(h('div', { class: 'panel' }, h('div', { class: 'panel-body muted' }, 'No notes yet — post the first one above.')));
  }
  for (const n of notes) {
    const card = h('div', { class: 'note-card wide', dataset: { id: n.id } },
      h('div', { class: 'note-text' }, n.message),
      h('div', { class: 'note-foot' },

        h('span', { class: 'spacer' }),

          if (await confirmDialog({ title: 'Delete note?', message: `"${n.message.slice(0, 60)}${n.message.length > 60 ? '…' : ''}" will be removed.` })) {
            await store.remove('notes', n.id);
